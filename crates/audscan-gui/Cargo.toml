[package]
name = "audscan-gui"
description = "Desktop front end for audscan-core"
version.workspace = true
edition.workspace = true
license.workspace = true
# egui 0.36 needs 1.95; the core library and CLI build on the workspace MSRV.
rust-version = "1.95"

[[bin]]
name = "audscan-gui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
audscan-core.workspace = true
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"
egui_extras = "0.36"
rfd = "0.17"

# Playback through Windows' own waveOut API (MIT or Apache-2.0 bindings).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Media_Audio"] }

[dev-dependencies]
audscan-fixtures.workspace = true
egui_kittest = "0.36"
tempfile.workspace = true
