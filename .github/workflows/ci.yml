# Build, test and lint on Windows, where audscan is developed, and check the MSRV.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets

  # The core library and CLI keep the workspace MSRV; the GUI needs what egui needs.
  msrv:
    name: MSRV (${{ matrix.toolchain }}, ${{ matrix.crates }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: "1.89"
            crates: core + cli
            packages: -p audscan-core -p audscan-cli -p audscan-fixtures
          - toolchain: "1.95"
            crates: gui
            packages: -p audscan-gui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ matrix.toolchain }}
      - run: cargo check ${{ matrix.packages }} --all-targets
